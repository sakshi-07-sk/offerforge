version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hr_postgres_db
    restart: always
    environment:
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: hr_password
      POSTGRES_DB: hr_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hr_network

  backend:
    build:
      context: ./backend
    container_name: hr_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://hr_user:hr_password@db:5432/hr_database?schema=public
      - JWT_SECRET=super_secret_jwt_key
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
      - SMTP_HOST=smtp.ethereal.email
      - SMTP_PORT=587
      - SMTP_USER=your_email
      - SMTP_PASS=your_pass
    depends_on:
      - db
    networks:
      - hr_network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
    container_name: hr_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
    depends_on:
      - backend
    networks:
      - hr_network
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:

networks:
  hr_network:
    driver: bridge
